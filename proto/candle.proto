syntax = "proto3";

package candle;

option go_package = "github.com/yourusername/trading-chart-service/internal/grpc/proto;candle";

service CandleService {
  rpc SubscribeCandles (CandleRequest) returns (stream Candle) {}
}

message CandleRequest {
  string symbol = 1;
}

message Candle {
  string symbol = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  double volume = 6;
  int64 timestamp = 7;
}